name: Newsletter delivery

# No cron: the existing content-producing automation owns the Sunday cadence.
# There are deliberately no pull_request or pull_request_target triggers.
on:
  push:
    branches: [main]
    paths: ['newsletter/issues/*.json']
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Approved issue date (YYYY-MM-DD); must already be on main'
        required: true
        type: string
      mode:
        description: 'Scheduling also requires reviewed policy capability gates'
        required: true
        default: draft
        type: choice
        options: [draft, schedule]

permissions:
  contents: read
  actions: read

concurrency:
  group: jacob-shope-newsletter-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'JLshope12/jacob-shope-mortgage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact trusted commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run offline safety tests
        run: python3 -m unittest discover -s scripts/newsletter -p 'test_*.py' -v

      - name: Select one immutable dated issue
        id: issue
        run: python3 scripts/newsletter/deliver.py select

      - name: Validate public-news-only content without credentials
        env:
          ISSUE_PATH: ${{ steps.issue.outputs.issue }}
        run: python3 scripts/newsletter/deliver.py validate --issue "$ISSUE_PATH"

      - name: Verify account, audience, content, and retry history
        id: prepare
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          KIT_ACCOUNT_ID: ${{ vars.KIT_ACCOUNT_ID }}
          KIT_ACCOUNT_NAME: ${{ vars.KIT_ACCOUNT_NAME }}
          KIT_NEWSLETTER_TAG_ID: ${{ vars.KIT_NEWSLETTER_TAG_ID }}
          KIT_NEWSLETTER_TAG_NAME: ${{ vars.KIT_NEWSLETTER_TAG_NAME }}
          KIT_TEMPLATE_ID: ${{ vars.KIT_TEMPLATE_ID }}
          KIT_TEMPLATE_NAME: ${{ vars.KIT_TEMPLATE_NAME }}
          KIT_EXCLUDED_EMAIL_SHA256: ${{ vars.KIT_EXCLUDED_EMAIL_SHA256 }}
          ISSUE_PATH: ${{ steps.issue.outputs.issue }}
          DELIVERY_MODE: ${{ steps.issue.outputs.mode }}
        run: >-
          python3 scripts/newsletter/deliver.py prepare
          --issue "$ISSUE_PATH" --mode "$DELIVERY_MODE"
          --journal-dir "$RUNNER_TEMP/newsletter-intent"

      - name: Retain write-ahead intent before any Kit write
        if: steps.prepare.outputs.write_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.prepare.outputs.marker }}
          path: ${{ runner.temp }}/newsletter-intent/intent.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

      - name: Deliver only after the intent is visible in GitHub
        if: steps.prepare.outputs.write_required == 'true'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          KIT_ACCOUNT_ID: ${{ vars.KIT_ACCOUNT_ID }}
          KIT_ACCOUNT_NAME: ${{ vars.KIT_ACCOUNT_NAME }}
          KIT_NEWSLETTER_TAG_ID: ${{ vars.KIT_NEWSLETTER_TAG_ID }}
          KIT_NEWSLETTER_TAG_NAME: ${{ vars.KIT_NEWSLETTER_TAG_NAME }}
          KIT_TEMPLATE_ID: ${{ vars.KIT_TEMPLATE_ID }}
          KIT_TEMPLATE_NAME: ${{ vars.KIT_TEMPLATE_NAME }}
          KIT_EXCLUDED_EMAIL_SHA256: ${{ vars.KIT_EXCLUDED_EMAIL_SHA256 }}
          ISSUE_PATH: ${{ steps.issue.outputs.issue }}
          DELIVERY_MODE: ${{ steps.issue.outputs.mode }}
        run: >-
          python3 scripts/newsletter/deliver.py execute
          --issue "$ISSUE_PATH" --mode "$DELIVERY_MODE"
          --journal-dir "$RUNNER_TEMP/newsletter-intent"
